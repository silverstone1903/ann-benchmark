services:
  chroma:
    # Pinned to match the client (chromadb==1.5.9 in engines/chroma/requirements.txt) — a
    # client/server version mismatch here breaks response parsing (see project memory).
    image: chromadb/chroma:1.5.9
    container_name: vecbench-chroma
    ports:
      - "8000:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    cpus: 4
    mem_limit: 8g
