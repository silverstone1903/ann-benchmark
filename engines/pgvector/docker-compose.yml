services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: vecbench-pgvector
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: vecbench
    ports:
      - "5432:5432"
    # Fairness control: same CPU/memory ceiling used for every engine's container.
    cpus: 4
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d vecbench"]
      interval: 2s
      timeout: 3s
      retries: 30
